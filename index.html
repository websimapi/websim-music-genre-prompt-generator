<html>
<head>
  <base href="." />
  <title>Music Genre Prompt Generator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Music Genre Prompt Generator</h1>
    <div class="sonauto-link">
      Create your AI music at <a href="https://sonauto.ai" target="_blank" rel="noopener">sonauto.ai</a>
    </div>
    
    <div class="mode-switch">
      <button id="simpleMode" class="mode-btn active">Simple Mode</button>
      <button id="advancedMode" class="mode-btn">Advanced Mode</button>
    </div>

    <div id="simpleInterface" class="interface-container">
      <div class="categories-selection">
        <h2>Select Categories to Include:</h2>
        <div id="categoryCheckboxes" class="checkbox-grid">
          <!-- Checkboxes will be dynamically added here -->
        </div>
      </div>

      <div class="word-count-control">
        <h2>Number of Words to Combine: <span id="wordCountDisplay">3</span></h2>
        <input type="range" id="wordCountSlider" min="2" max="6" value="3" class="slider">
      </div>

      <div class="controls">
        <button id="generateBtn" class="generate-btn">Generate Prompt</button>
        <button id="selectAllBtn" class="select-btn">Select All</button>
        <button id="deselectAllBtn" class="select-btn">Deselect All</button>
      </div>
    </div>

    <div id="advancedInterface" class="interface-container hidden">
      <div class="categories-explorer">
        <div class="category-list">
          <h2>Categories</h2>
          <div id="categoryList"></div>
        </div>
        <div class="subcategory-list">
          <h2>Subcategories</h2>
          <div id="subcategoryList"></div>
        </div>
        <div class="word-list">
          <h2>Words</h2>
          <div id="wordList"></div>
        </div>
      </div>
      <div class="selected-words">
        <h2>Selected Words</h2>
        <div id="selectedWordsList"></div>
        <button id="generateFromSelected" class="generate-btn">Generate from Selected</button>
      </div>
    </div>

    <div class="output-section">
      <h2>Generated Prompt:</h2>
      <div id="output" class="output-box" role="button" tabindex="0" title="Click to copy">
        <div class="output-text"></div>
        <div class="copy-tooltip">Click to copy</div>
      </div>
      
      <div class="upload-section">
        <h3>Share Your Creation</h3>
        <p>Upload an audio file inspired by this prompt:</p>
        <input type="file" id="audioUpload" accept="audio/*" class="file-input">
        <button id="uploadBtn" class="upload-btn" disabled>Upload</button>
      </div>

      <div class="gallery" id="audioGallery">
        <!-- Audio entries will be added here -->
      </div>
    </div>
  </div>
  
  <script src="descriptors.js"></script>
  <script src="app.js"></script>

</body>
</html>
